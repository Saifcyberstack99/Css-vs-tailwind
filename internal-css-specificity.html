<!DOCTYPE html>
<html>
<head>
  <title>Internal CSS Specificity</title>

  <style>
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .box {
      background: green;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s, background-color 0.3s;

    }
    .box:hover{
      background-color: blue;
      transform: scale(1.1);

    }

    #special {
      background: red;
    }
    #special:hover{
      background-color: blue;
    }
  </style>
</head>
<body>

  <div id="special" class="box">Saif</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Z-Index Demo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f5f5f5;
  }

  h2 {
    text-align: center;
  }

  .demo-container {
    position: relative;
    height: 200px;
    width: 400px;
    margin: 20px auto;
    border: 2px dashed #333;
    border-radius: 12px;
    background: #fff;
  }

  .box {
    width: 100px;
    height: 100px;
    color: #fff;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute  ;
    border-radius: 8px;
    cursor: grab;
    gap: 20px;
  }

  .box1 { background: #e74c3c; top: 20px; left: 50px; }
  .box2 { background: #3498db; top: 50px; left: 120px; }
  .box3 { background: #2ecc71; top: 80px; left: 200px; }

  .slider-container {
    display: flex;
    justify-content: space-around;
    margin-top: 30px;
  }

  .slider-box {
    text-align: center;
  }

  input[type="range"] {
    width: 120px;
  }
</style>
</head>
<body>

<h2>Interactive Z-Index Demo</h2>

<div class="demo-container">
  <div class="box box1">Box 1</div>
  <div class="box box2">Box 2</div>
  <div class="box box3">Box 3</div>
</div>

<div class="slider-container">
  <div class="slider-box">
    <label>Box 1 Z-index: <span id="z1">1</span></label><br>
    <input type="range" min="0" max="20" value="1" id="slider1">
  </div>
  <div class="slider-box">
    <label>Box 2 Z-index: <span id="z2">2</span></label><br>
    <input type="range" min="0" max="20" value="5" id="slider2">
  </div>
  <div class="slider-box">
    <label>Box 3 Z-index: <span id="z3">3</span></label><br>
    <input type="range" min="0" max="20" value="10" id="slider3">
  </div>
</div>

<script>
  const box1 = document.querySelector('.box1');
  const box2 = document.querySelector('.box2');
  const box3 = document.querySelector('.box3');

  const slider1 = document.getElementById('slider1');
  const slider2 = document.getElementById('slider2');
  const slider3 = document.getElementById('slider3');

  const z1 = document.getElementById('z1');
  const z2 = document.getElementById('z2');
  const z3 = document.getElementById('z3');

  slider1.addEventListener('input', () => {
    box1.style.zIndex = slider1.value;
    z1.innerText = slider1.value;
  });

  slider2.addEventListener('input', () => {
    box2.style.zIndex = slider2.value;
    z2.innerText = slider2.value;
  });

  slider3.addEventListener('input', () => {
    box3.style.zIndex = slider3.value;
    z3.innerText = slider3.value;
  });
</script>

</body>
</html>
